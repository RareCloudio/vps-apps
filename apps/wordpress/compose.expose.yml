# After exposure: the caddy labels serve WordPress on the server's own name (VA_SITE_ADDRS in the app
# .env). The default network is kept for the database; web is the proxy's network. Apache listens on
# port 80 in the container; Caddy terminates HTTPS and sends X-Forwarded-Proto and X-Forwarded-For,
# which the image honours (its wp-config.php and its mod_remoteip config for private networks).
services:
  wordpress:
    networks:
      - default
      - web
    # xmlrpc.php is refused with a 403 before WordPress sees it: its system.multicall tries
    # hundreds of passwords against the well-known admin login in one request, and WordPress has
    # no lockout. The path below it is refused too, because Apache runs xmlrpc.php for
    # /xmlrpc.php/<anything>. Caddy's path matcher ignores case and matches the decoded, cleaned
    # path. A plain respond is enough: Caddy's directive order puts respond ahead of reverse_proxy
    # (https://caddyserver.com/docs/caddyfile/directives#directive-order). Named matcher labels:
    # https://github.com/lucaslorentz/caddy-docker-proxy#sites-snippets-and-global-options.
    labels:
      caddy: ${VA_SITE_ADDRS:?VA_SITE_ADDRS is not set}
      caddy.@xmlrpc.path: "/xmlrpc.php /xmlrpc.php/*"
      caddy.respond: "@xmlrpc 403"
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  web:
    external: true
